[package]
name = "vibefleet"
version = "0.1.0"
edition = "2021"
description = "A ratatui control room for orchestrating a fleet of AI coding agents in parallel git worktrees, with Flagsmith-driven feature flags."

[[bin]]
name = "vibefleet"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
ratatui-textarea = "0.9"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
directories = "5"

# Optional live Flagsmith backend. Enable with: cargo run --features live-flagsmith
# Requires network + a Flagsmith environment key at runtime.
flagsmith = { version = "3", optional = true }

[features]
default = []
live-flagsmith = ["dep:flagsmith"]

[profile.release]
opt-level = 2
lto = "thin"
